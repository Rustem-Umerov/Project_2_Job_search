[project]
name = "project-2-job-search"
version = "0.1.0"
description = ""
authors = [
    {name = "Rustem Umerov",email = "rustem.umerov.00@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
flake8 = "^7.3.0"
mypy = "^1.17.1"
isort = "^6.0.1"


[tool.poetry.group.dev.dependencies]
pre-commit = "^3.7.0"


[tool.poetry.group.test.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"


[tool.black]
line-length = 119
exclude = '''
/(
    \.git
)/
'''


[tool.isort]
line_length = 119


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'